name: release

# ADR-0015: release-please or conventional commits derive semver releases
# from Conventional Commits on `main` only - the human merging `daily` into
# `main` is the release decision.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Run release-please
        id: release
        uses: google-github-actions/release-please-action@v4
        with:
          # Configure based on your release-please config
          # For TypeScript projects using conventional commits
          package-name: "layered-data"
          release-type: "node"
          # Custom config file if needed
          # config-file: release-please-config.json
          # manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build distributions
        run: npm run build

      # Note: layered-data is currently a frontend-only project
      # If publishing to npm becomes relevant, uncomment:
      # - name: Publish to npm
      #   run: npm publish
      #   env:
      #     NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
