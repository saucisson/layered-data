name: reviewer

# The reviewer agent as a CI job (ADR-0016): the review runs on every
# pull request push, and its exit code becomes a REQUIRED status check,
# so "zero BLOCKING findings" is machine-checkable before any merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reviewer:
    name: reviewer agent
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export the pull request description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .review
          # Get PR description using GitHub CLI
          if command -v gh &> /dev/null; then
            gh pr view "${{ github.event.pull_request.number }}" --json body --jq '.body' > .review/pull-request-description.md || true
          else
            # Fallback: create empty description file
            touch .review/pull-request-description.md
          fi

      - name: Generate the PR diff
        run: |
          # Generate diff between base and head
          git diff --no-color "origin/${{ github.base_ref }}...HEAD" > .review/pull-request.diff || true

      - name: Run the reviewer agent
        run: |
          node scripts/agent-review.mjs

      - name: Publish the review comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Install GitHub CLI if not available
          if ! command -v gh &> /dev/null; then
            echo "Installing GitHub CLI..."
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update && sudo apt install gh -y
          fi
          
          # Post the review comment
          if [ -f .review/review-comment.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file .review/review-comment.md || true
          else
            echo "No review comment file found"
          fi

      - name: Archive the review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: .review/
          if-no-files-found: warn
