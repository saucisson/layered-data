name: reviewer

# The reviewer agent as a CI job (ADR-0016): the review runs on every
# pull request push, and its exit code becomes a REQUIRED status check,
# so "zero BLOCKING findings" is machine-checkable before any merge.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reviewer:
    name: reviewer agent
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'human-approved'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export the pull request description
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .review
          # Try to get PR description via GitHub API
          PR_DESCRIPTION=$(curl -s -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}" | \
            jq -r '.body // ""')
          echo "$PR_DESCRIPTION" > .review/pull-request-description.md

      - name: Export the pull request labels
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .review
          # Labels of the PR via GitHub API — the reviewer reads them
          # from the bundle (a manually posed `human-approved` label
          # waives the constitutional-file gate, ADR-0011)
          curl -s -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" | \
            jq '[.[].name]' > .review/pull-request-labels.json

      - name: Generate the PR diff
        run: |
          # Generate diff between base and head
          git diff --no-color "origin/${{ github.base_ref }}...HEAD" > .review/pull-request.diff || true

      - name: Run the reviewer agent
        run: |
          node scripts/cli.mjs review

      - name: Publish the review comment
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Post the review comment via GitHub API
          if [ -f .review/review-comment.md ]; then
            COMMENT_BODY=$(cat .review/review-comment.md)
            # Escape newlines and special chars for JSON
            COMMENT_BODY_JSON=$(echo "$COMMENT_BODY" | jq -Rs .)
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -d "{\"body\": $COMMENT_BODY_JSON}" || true
          else
            echo "No review comment file found"
          fi

      - name: Archive the review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: .review/
          if-no-files-found: warn
