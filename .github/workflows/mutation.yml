name: mutation-testing

# ADR-0013: mutation testing runs on `daily` at end of day to ensure
# test quality. Surviving mutants become issues.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run mutation testing on"
        required: true
        default: "daily"
  schedule:
    # Run at end of business day (adjust as needed)
    - cron: "0 18 * * 1-5"

jobs:
  mutate:
    name: mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'daily' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run mutation testing with Stryker
        run: |
          # Install Stryker if not already in dependencies
          npm install --save-dev @stryker-mutator/core @stryker-mutator/typescript-checker @stryker-mutator/jest-runner 2>&1 | grep -v "audited" || true

          # Configure Stryker (minimal config)
          cat > stryker.conf.js << 'EOF'
          module.exports = {
            _comment: "Configuration for mutation testing",
            mutate: [
              "src/**/*.ts",
              "src/**/*.tsx",
              "!src/**/*.test.ts",
              "!src/**/*.test.tsx",
              "!src/**/*.spec.ts",
              "!src/**/*.d.ts"
            ],
            mutator: "typescript",
            parsers: { tsconfig: {} },
            transpilers: [],
            testRunner: "command",
            testFramework: "npm",
            testCommand: "npm test",
            reporters: ["clear-text", "progress"],
            coverageAnalysis: "perTest"
          };
          EOF

          # Run Stryker (this may take a while)
          npx stryker run --fileLogLevel trace || true

      - name: Parse mutation results
        id: results
        run: |
          # Check if mutation report exists
          if [ -f reports/mutation/mutants.html ]; then
            echo "Mutation report generated"
            # Count surviving mutants
            SURVIVED=$(grep -o '"survived": *[0-9]*' reports/mutation/json-report.json | grep -o '[0-9]*' || echo "0")
            echo "Survived mutants: $SURVIVED"
            
            if [ "$SURVIVED" -gt 0 ]; then
              echo "SURVIVED=$SURVIVED" >> $GITHUB_OUTPUT
              echo "Has surviving mutants" >> $GITHUB_STEP_SUMMARY
            else
              echo "All mutants killed!" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No mutation report found, skipping" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create issues for surviving mutants
        if: steps.results.outputs.SURVIVED > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Would create issues for ${{ steps.results.outputs.SURVIVED }} surviving mutants"
          echo "This is a placeholder - implement based on your mutation report format"
          # In a real implementation, you would:
          # 1. Parse the mutation report
          # 2. For each surviving mutant, create an issue with:
          #    - The file and line number
          #    - The type of mutation
          #    - The test that didn't catch it
          # 3. Label as "mutation-escape" and "needs-human"
