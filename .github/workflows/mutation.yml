name: mutation-testing

# Mutation testing on the kernel language pipeline (src/domain/language),
# per the owner decision recorded in docs/branching.md §6 (issue #24):
# Stryker runs on a daily cron and FAILS on a low mutation score
# (thresholds in stryker.config.json, break = 50%).
#
# The command runner executes the specification and staging
# harnesses per mutant (~32s, 1379 mutants, ~3h at concurrency 4).
# Reports are uploaded as artifacts; surviving mutants are listed in
# the job summary.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run mutation testing on"
        required: true
        default: "daily"
  schedule:
    # End of business day, weekdays
    - cron: "0 18 * * 1-5"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutate:
    name: mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'daily' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # No `|| true`: a mutation score below the break threshold (or any
      # Stryker error) exits non-zero and fails the workflow.
      - name: Run Stryker (command runner)
        run: npx stryker run

      - name: Mutation score summary
        if: always()
        run: |
          REPORT=reports/mutation/mutation-report.json
          if [ -f "$REPORT" ]; then
            node -e '
              const report = require("./reports/mutation/mutation-report.json");
              const m = report.metrics;
              const summary = [
                `Mutation score: ${m.mutationScore}%`,
                `Killed: ${m.killed}, survived: ${m.survived}, no coverage: ${m.noCoverage}, timeout: ${m.timeout}, runtime errors: ${m.runtimeErrors}, total: ${m.totalMutants}`
              ].join("\n");
              console.log(summary);
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Mutation testing\n" + summary + "\n");
            '
          else
            echo "No mutation report found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
