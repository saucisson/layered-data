# The CI of the atelier — the same gates, in the same order, as a
# local `npm run verify`. The kernel behavior is a contract: any push
# that breaks the types (strict, no emit), the presentation
# structure, the harnesses (executable specification,
# staging), the bilingual parity, or the build is refused.
#
# The typecheck is the gate that no sandbox in this repository can
# replace: Node strips types at run time, it never checks them. The
# CI is where the strict compiler actually reads the whole tree —
# src (app config) and server, tests, vite config (node config).
#
# This workflow enforces the quality gates from ADR-0008.
name: ci

on:
  push:
    branches: [main, daily]
  pull_request:

# Successive pushes on the same ref cancel the superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: quality gate (types, lint, structure, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Types (strict, no emit - both configs)
        run: npm run typecheck

      - name: Presentation structure
        run: npm run check:structure

      - name: "Lint (ESLint: boundaries, no-console, named exports)"
        run: npm run lint

      - name: Build
        run: npm run build

  harness-kernel:
    name: "harness: kernel (specification, staging, pen-loop, stream, perf, validation-session)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:specification
      - run: npm run test:staging
      - run: npm run test:pen-loop
      - run: npm run test:stream
      - run: npm run test:perf
      - run: npm run test:validation-session

  harness-editor:
    name: "harness: editor (editor, model-editor, editor-session, pages)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:editor
      - run: npm run test:model-editor
      - run: npm run test:editor-session
      - run: npm run test:pages

  harness-i18n:
    name: "harness: i18n (i18n, i18n:check)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:i18n
      - run: npm run i18n:check

  harness-server:
    name: "harness: server (server, rate-limit, postgres, user-account, access-code-consent)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:server
      - run: npm run test:rate-limit
      - run: npm run test:postgres
      - run: npm run test:user-account
      - run: npm run test:access-code-consent

  harness-versioning:
    name: "harness: versioning (vscode, stratigraphy, repin-harness)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:vscode
      - run: npm run test:stratigraphy
      - run: npm run test:repin-harness

  harness-meta:
    name: "harness: meta (reviewer, error-boundary) + coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:reviewer
      - run: npm run test:error-boundary
      - name: Coverage gate (c8, lines >= 85%)
        run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  security:
    name: security gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Fails on critical vulnerabilities. The remaining high-severity
      # vite advisories need a major bump (vite 8) - escalated as
      # needs-human, see issue #27.
      - name: npm audit (critical gate)
        run: npm audit --audit-level=critical

  e2e:
    name: browser E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install the chromium browser
        run: npx playwright install --with-deps chromium

      - name: The browser harnesses (smoke + canvas gesture)
        run: npm run test:e2e
