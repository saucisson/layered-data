# Development override (issue #204) — hot reload for the web app:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# The atelier service runs the vite dev server (port 5173, HMR) next to
# the API (server.ts on 8791, which the vite proxy forwards /api to).
# The repository is bind-mounted, so editing src/ on the host reloads
# the page in the browser. node_modules stays in an anonymous volume so
# the host install (if any) never leaks into the container.
# The production image and the default `docker compose up` are unchanged.
services:
  atelier:
    build:
      context: .
      target: dev
    command: sh -c "node server.ts & npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "127.0.0.1:8791:8791"
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - atelier-data:/app/data
    # Le durcissement du service de production (docker-compose.yml) est
    # hérité par cet override. Il reste valable ici sauf les
    # capabilities : le conteneur dev tourne en root sur le dépôt
    # bind-mounté, et cap_drop: ALL priverait le root du droit d'écrire
    # les fichiers de l'hôte (pas de CAP_DAC_OVERRIDE). La balise !reset
    # exige docker compose v2.24+ ; read_only, le tmpfs /tmp et
    # no-new-privileges restent actifs en dev (toutes les écritures
    # passent déjà par des montages).
    cap_drop: !reset []
